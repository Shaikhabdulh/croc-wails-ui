<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="croc-wails-ui logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14505A"/>
      <stop offset="1" stop-color="#0A2830"/>
    </linearGradient>
    <linearGradient id="jaw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF7F1"/>
      <stop offset="1" stop-color="#9ED8C0"/>
    </linearGradient>
  </defs>

  <!-- app icon base -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <g transform="translate(-28 0)">
  <!-- jaw: one symmetrical C-shaped path, teeth on both sides -->
  <path fill="url(#jaw)" d="
    M 230 512
    C 230 400, 320 320, 460 320
    L 800 320 Q 850 320 850 370 L 850 400
    L 790 400 L 760 452 L 730 400 L 690 400 L 660 452 L 630 400
    L 590 400 L 560 452 L 530 400 L 470 400
    Q 372 400 360 512
    Q 372 624 470 624
    L 530 624 L 560 572 L 590 624 L 630 624 L 660 572 L 690 624
    L 730 624 L 760 572 L 790 624 L 850 624
    L 850 654 Q 850 704 800 704 L 460 704
    C 320 704, 230 624, 230 512 Z"/>

  <!-- eye -->
  <circle cx="452" cy="362" r="15" fill="#0F3B44"/>

  <!-- transfer trail -->
  <circle cx="424" cy="512" r="7"  fill="#FFB547" opacity=".35"/>
  <circle cx="470" cy="512" r="9"  fill="#FFB547" opacity=".55"/>
  <circle cx="520" cy="512" r="11" fill="#FFB547" opacity=".8"/>

  <!-- file packet between the teeth -->
  <g transform="rotate(8 652 512)">
    <rect x="612" y="474" width="80" height="76" rx="14" fill="#FFB547"/>
    <path d="M 664 474 H 678 Q 692 474 692 488 V 502 Z" fill="#FFD58A"/>
  </g>
  </g>
</svg>
