name: Multi-Platform Build & Release Matrix

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. LINUX (amd64 on x86_64 & arm64 on native ARM runner)
  # -------------------------------------------------------------
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev file

      - name: Build Frontend Assets
        run: |
          cd frontend
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Compile Standalone Linux Binary (${{ matrix.arch }})
        run: |
          mkdir -p build/bin
          go build -tags "gtk3 croc_no_tailcat" -ldflags="-s -w" -o build/bin/croc-wails-ui .

      - name: Package Linux Distribution Artifacts (.deb, .tar.gz, AppDir)
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh

      - name: Build AppImage (amd64)
        if: matrix.arch == 'amd64'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          cd /tmp && ./appimagetool --appimage-extract && cd -
          /tmp/squashfs-root/AppRun build/dist/croc-wails-ui.AppDir build/dist/croc-wails-ui-1.0.0-x86_64.AppImage || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: croc-wails-ui-linux-${{ matrix.arch }}
          path: build/dist/*
          if-no-files-found: warn

  # -------------------------------------------------------------
  # 2. WINDOWS (x86_64, arm64, 386) - .exe
  # -------------------------------------------------------------
  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            suffix: x86_64
          - arch: arm64
            goarch: arm64
            suffix: arm64
          - arch: '386'
            goarch: '386'
            suffix: x86
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Frontend Assets
        shell: bash
        run: |
          cd frontend
          bun install
          bun run build

      - name: Compile Windows Binary
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build/dist
          go build -tags "croc_no_tailcat" -ldflags="-s -w -H windowsgui" -o "build/dist/croc-wails-ui-${{ matrix.suffix }}.exe" .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: croc-wails-ui-windows-${{ matrix.suffix }}
          path: build/dist/*.exe

  # -------------------------------------------------------------
  # 3. macOS (Apple Silicon, Intel & Universal DMG)
  # -------------------------------------------------------------
  build-macos:
    name: macOS (Universal M1/M2/M3/M4 & Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Frontend Assets
        run: |
          cd frontend
          bun install
          bun run build

      - name: Compile macOS Apple Silicon (arm64)
        run: |
          mkdir -p build/dist/mac
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CC="clang -target arm64-apple-macos11.0 -isysroot $(xcrun --show-sdk-path)" \
          go build -tags "croc_no_tailcat" -ldflags="-s -w" -o build/dist/mac/croc-wails-ui-arm64 .

      - name: Compile macOS Intel (x86_64)
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -target x86_64-apple-macos10.15 -isysroot $(xcrun --show-sdk-path)" \
          go build -tags "croc_no_tailcat" -ldflags="-s -w" -o build/dist/mac/croc-wails-ui-amd64 .

      - name: Create Universal Binary & App Bundle
        run: |
          lipo -create -output build/dist/mac/croc-wails-ui-universal \
            build/dist/mac/croc-wails-ui-arm64 \
            build/dist/mac/croc-wails-ui-amd64

          mkdir -p "build/dist/Croc.app/Contents/MacOS"
          mkdir -p "build/dist/Croc.app/Contents/Resources"
          cp build/dist/mac/croc-wails-ui-universal "build/dist/Croc.app/Contents/MacOS/croc-wails-ui"
          cp croc-wails-ui-logo.png "build/dist/Croc.app/Contents/Resources/appicon.png"

          cat << 'EOF' > "build/dist/Croc.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>croc-wails-ui</string>
            <key>CFBundleIconFile</key>
            <string>appicon.png</string>
            <key>CFBundleIdentifier</key>
            <string>com.croc.wails.ui</string>
            <key>CFBundleName</key>
            <string>Croc</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
          </dict>
          </plist>
          EOF

          cd build/dist
          hdiutil create -volname "Croc" -srcfolder "Croc.app" -ov -format UDZO "croc-wails-ui-Universal.dmg"
          zip -r "croc-wails-ui-macos-Universal.zip" "Croc.app"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: croc-wails-ui-macos-Universal
          path: |
            build/dist/croc-wails-ui-Universal.dmg
            build/dist/croc-wails-ui-macos-Universal.zip

  # -------------------------------------------------------------
  # 4. GITHUB RELEASE (On Tags)
  # -------------------------------------------------------------
  release:
    name: Publish Release Artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p dist-release
          find release-artifacts -type f -exec cp {} dist-release/ \;
          ls -la dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
