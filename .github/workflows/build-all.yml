name: Multi-Platform Build & Release Matrix

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # -------------------------------------------------------------
  # 1. LINUX (amd64 on x86_64 & arm64 on native ARM runner)
  # -------------------------------------------------------------
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev file
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Build Frontend Assets
        run: |
          cd frontend
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Compile Standalone Linux Binary (${{ matrix.arch }})
        run: |
          mkdir -p build/bin
          go build -tags "gtk3 croc_no_tailcat" -ldflags="-s -w" -o build/bin/croc-wails-ui .

      - name: Package Linux Distribution Artifacts (.deb, .tar.gz, AppDir)
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh

      - name: Build AppImage (amd64)
        if: matrix.arch == 'amd64'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          cd /tmp && ./appimagetool --appimage-extract && cd -
          /tmp/squashfs-root/AppRun build/dist/croc-wails-ui.AppDir build/dist/croc-wails-ui-0.1.0-x86_64.AppImage || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: croc-wails-ui-linux-${{ matrix.arch }}
          path: |
            build/dist/*.deb
            build/dist/*.tar.gz
            build/dist/*.AppImage
          retention-days: 1
          if-no-files-found: warn

  # -------------------------------------------------------------
  # 2. WINDOWS (x86_64, arm64, 386) - .exe
  # -------------------------------------------------------------
  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            suffix: x86_64
          - arch: arm64
            goarch: arm64
            suffix: arm64
          - arch: '386'
            goarch: '386'
            suffix: x86
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Frontend Assets
        shell: bash
        run: |
          cd frontend
          bun install
          bun run build

      - name: Compile Windows Binary
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build/dist
          go build -tags "croc_no_tailcat" -ldflags="-s -w -H windowsgui" -o "build/dist/croc-wails-ui-${{ matrix.suffix }}.exe" .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: croc-wails-ui-windows-${{ matrix.suffix }}
          path: build/dist/*.exe
          retention-days: 1

  # -------------------------------------------------------------
  # 3. macOS (Apple Silicon, Intel & Universal DMG)
  # -------------------------------------------------------------
  build-macos:
    name: macOS (Universal M1/M2/M3/M4 & Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Frontend Assets
        run: |
          cd frontend
          bun install
          bun run build

      - name: Compile macOS Apple Silicon (arm64)
        run: |
          mkdir -p build/dist/mac
          SDKPATH=$(xcrun --show-sdk-path)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CC=clang \
          CGO_CFLAGS="-target arm64-apple-macos11.0 -isysroot $SDKPATH" \
          CGO_LDFLAGS="-target arm64-apple-macos11.0 -isysroot $SDKPATH" \
          go build -tags "croc_no_tailcat" -ldflags="-s -w" -o build/dist/mac/croc-wails-ui-arm64 .

      - name: Compile macOS Intel (x86_64)
        run: |
          SDKPATH=$(xcrun --show-sdk-path)
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC=clang \
          CGO_CFLAGS="-target x86_64-apple-macos10.15 -isysroot $SDKPATH" \
          CGO_LDFLAGS="-target x86_64-apple-macos10.15 -isysroot $SDKPATH" \
          go build -tags "croc_no_tailcat" -ldflags="-s -w" -o build/dist/mac/croc-wails-ui-amd64 . || true

      - name: Create Universal Binary & App Bundle
        run: |
          mkdir -p "build/dist/Croc.app/Contents/MacOS"
          mkdir -p "build/dist/Croc.app/Contents/Resources"

          if [ -f build/dist/mac/croc-wails-ui-arm64 ] && [ -f build/dist/mac/croc-wails-ui-amd64 ]; then
            echo "Both arm64 and amd64 binaries available, merging into Universal binary with lipo..."
            lipo -create -output build/dist/mac/croc-wails-ui-universal \
              build/dist/mac/croc-wails-ui-arm64 \
              build/dist/mac/croc-wails-ui-amd64
            cp build/dist/mac/croc-wails-ui-universal "build/dist/Croc.app/Contents/MacOS/croc-wails-ui"
          else
            echo "Using Apple Silicon binary for App bundle..."
            cp build/dist/mac/croc-wails-ui-arm64 "build/dist/Croc.app/Contents/MacOS/croc-wails-ui"
          fi
          cp croc-wails-ui-logo.png "build/dist/Croc.app/Contents/Resources/appicon.png"

          cat << 'EOF' > "build/dist/Croc.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>croc-wails-ui</string>
            <key>CFBundleIconFile</key>
            <string>appicon.png</string>
            <key>CFBundleIdentifier</key>
            <string>com.croc.wails.ui</string>
            <key>CFBundleName</key>
            <string>Croc</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
          </dict>
          </plist>
          EOF

          cd build/dist
          hdiutil create -volname "Croc" -srcfolder "Croc.app" -ov -format UDZO "croc-wails-ui-Universal.dmg"
          zip -r "croc-wails-ui-macos-Universal.zip" "Croc.app"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: croc-wails-ui-macos-Universal
          path: |
            build/dist/croc-wails-ui-Universal.dmg
            build/dist/croc-wails-ui-macos-Universal.zip
          retention-days: 1

  # -------------------------------------------------------------
  # 4. ANDROID (Debug APK & Mobile Daemon)
  # -------------------------------------------------------------
  build-android:
    name: Android (APK & Native Daemon)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Frontend Web Assets
        run: |
          cd frontend
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Compile Croc Micro-Daemon for Android (arm64)
        run: |
          mkdir -p mobile/android/app/src/main/assets/bin
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -tags "croc_no_tailcat" -ldflags="-s -w" -o mobile/android/app/src/main/assets/bin/croc-daemon-arm64 ./cmd/croc-daemon
          mkdir -p build/dist/android
          cp mobile/android/app/src/main/assets/bin/croc-daemon-arm64 build/dist/android/

      - name: Sync Capacitor Android Project
        run: |
          cd mobile
          bun install
          bunx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage Android APK Artifacts
        run: |
          mkdir -p build/dist/android
          cp mobile/android/app/build/outputs/apk/debug/*.apk build/dist/android/ || true
          ls -la build/dist/android/

      - name: Package iOS Xcode Project
        run: |
          cd mobile
          bunx cap sync ios || true
          zip -r ../build/dist/android/croc-wails-ui-ios-xcode-project.zip ios capacitor.config.json

      - name: Upload Mobile Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: croc-wails-ui-mobile
          path: |
            build/dist/android/*.apk
            build/dist/android/croc-daemon-arm64
            build/dist/android/croc-wails-ui-ios-xcode-project.zip
          retention-days: 1
          if-no-files-found: warn

  # -------------------------------------------------------------
  # 5. GITHUB RELEASE (On Tags)
  # -------------------------------------------------------------
  release:
    name: Publish Release Artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Filter & Flatten Distribution Artifacts
        run: |
          mkdir -p dist-release
          find release-artifacts -type f \( \
            -name "*.deb" -o \
            -name "*.tar.gz" -o \
            -name "*.AppImage" -o \
            -name "*.exe" -o \
            -name "*.dmg" -o \
            -name "*.zip" -o \
            -name "*.apk" -o \
            -name "croc-daemon-arm64" \
          \) -exec cp {} dist-release/ \;
          ls -lh dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true

      - name: Purge Runner Artifact Storage (Free Actions Quota)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up temporary build artifacts to keep Actions storage usage at 0 MB..."
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id' | while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
          echo "Artifact cleanup completed."
